# Test Profile Configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS cv_parser
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        default_schema: cv_parser
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  flyway:
    enabled: false

# Storage (Mock/Test)
storage:
  endpoint: ${TEST_STORAGE_ENDPOINT:http://localhost:9000}
  access-key-id: ${TEST_STORAGE_ACCESS_KEY:test}
  secret-access-key: ${TEST_STORAGE_SECRET_KEY:test}
  bucket: ${TEST_STORAGE_BUCKET:test-bucket}
  region: ${TEST_STORAGE_REGION:us-east-1}

# LLM (Test - use mocks)
llm:
  api-key: ${TEST_LLM_API_KEY:test-key}
  model: gemini-2.5-flash
  timeout-seconds: 5
  base-url: https://generativelanguage.googleapis.com/v1beta

# Tesseract
tesseract:
  data-path: ${TESSERACT_DATA_PATH:}
  language: eng

# File validation (smaller limits for tests)
file:
  max-size-mb: 5
  max-pages: 10
  allowed-types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health

# Logging
logging:
  level:
    root: WARN
    com.talentflow.cvparser: DEBUG
