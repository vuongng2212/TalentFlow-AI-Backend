spring:
  application:
    name: cv-parser

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rabbitmq}
    password: ${RABBITMQ_PASS:rabbitmq}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${AMQP_LISTENER_PREFETCH:2}
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/talentflow_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: cv_parser
    open-in-view: false

  # Flyway Migration
  flyway:
    enabled: true
    schemas: cv_parser
    create-schemas: true
    locations: classpath:db/migration

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Server Configuration
server:
  port: ${SERVER_PORT:8081}

# Storage Configuration (S3/MinIO/R2)
storage:
  endpoint: ${R2_ENDPOINT:http://localhost:9000}
  access-key-id: ${R2_ACCESS_KEY_ID:minioadmin}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:minioadmin}
  bucket: ${R2_BUCKET:talentflow-cvs}
  region: ${R2_REGION:us-east-1}

# LLM Configuration (Google Gemini)
llm:
  provider: ${LLM_PROVIDER:google}
  model: ${LLM_MODEL:gemini-2.5-flash}
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:8}
  extraction-timeout-seconds: ${LLM_EXTRACTION_TIMEOUT_SECONDS:20}
  http:
    max-connections: ${LLM_HTTP_MAX_CONNECTIONS:10}
  max-tokens: ${LLM_MAX_TOKENS:8192}
  min-text-length: ${LLM_MIN_TEXT_LENGTH:50}
  scoring:
    timeout-seconds: ${LLM_SCORING_TIMEOUT_SECONDS:10}
    fallback-score: ${LLM_SCORING_FALLBACK_SCORE:50}
    fallback-reason: "Scoring unavailable"
    max-retries: ${LLM_SCORING_MAX_RETRIES:2}

# OCR Configuration (Tesseract)
tesseract:
  data-path: ${TESSERACT_DATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
  language: ${TESSERACT_LANGUAGE:eng+vie}

# File Validation
file:
  max-size-mb: ${FILE_MAX_SIZE_MB:10}
  max-pages: ${FILE_MAX_PAGES:20}
  allowed-types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    rabbit:
      enabled: true
    db:
      enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      geminiApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      geminiApi:
        max-attempts: 2
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      geminiApi:
        timeout-duration: 30s
  ratelimiter:
    instances:
      geminiApi:
        limit-for-period: 100
        limit-refresh-period: 60s
        timeout-duration: 5s

# AMQP Listener Configuration
amqp:
  listener:
    concurrency: ${AMQP_LISTENER_CONCURRENCY:2}

# Logging Configuration
logging:
  level:
    root: INFO
    com.talentflow.cvparser: DEBUG
    org.springframework.amqp: INFO
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CV Parser worker configuration (decoupled from scoring-client retry settings)
cv:
  parser:
    # Max redelivery attempts for transient pipeline failures before routing to DLQ.
    # Kept separate from llm.scoring.max-retries so tuning scoring retries does not
    # unexpectedly change DLQ behavior.
    max-retries: ${CV_PARSER_MAX_RETRIES:3}

app:
  storage:
    endpoint: ${R2_ENDPOINT:http://localhost:9000}
    access-key: ${R2_ACCESS_KEY_ID:minioadmin}
    secret-key: ${R2_SECRET_ACCESS_KEY:minioadmin}
    bucket: ${R2_BUCKET_NAME:talentflow-cvs}
    region: ${R2_REGION:auto}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:5242880}
    path-style-access: ${PATH_STYLE_ACCESS:true}
    temp-dir: ${CV_PARSER_TEMP_DIR:}

  parser:
    ocr-timeout-seconds: ${OCR_TIMEOUT_SECONDS:30}
    page-timeout-seconds: ${OCR_PAGE_TIMEOUT_SECONDS:15}
    docx:
      min-inflate-ratio: ${DOCX_MIN_INFLATE_RATIO:0.01}
      max-entry-size: ${DOCX_MAX_ENTRY_SIZE:20971520}
      max-text-size: ${DOCX_MAX_TEXT_SIZE:2000000}
    pdf:
      max-pages: ${PDF_MAX_PAGES:10}
      max-text-size: ${PDF_MAX_TEXT_SIZE:2000000}

  ocr:
    tessdata-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/4.00/tessdata}
    language: ${OCR_LANGUAGE:vie+eng}
    dpi: ${OCR_DPI:150}
    max-pages: ${OCR_MAX_PAGES:20}
    max-parallel-pages: ${OCR_MAX_PARALLEL_PAGES:2}
    pool-borrow-timeout-seconds: ${OCR_POOL_BORROW_TIMEOUT_SECONDS:30}
    max-rendered-pixels-per-page: ${OCR_MAX_RENDERED_PIXELS_PER_PAGE:20000000}
    min-text-length-threshold: ${OCR_MIN_TEXT_THRESHOLD:100}

