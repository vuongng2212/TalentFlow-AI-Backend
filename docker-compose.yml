# Docker Compose for TalentFlow AI Backend
# Infrastructure services for local development

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: talentflow-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Provide default URLs based on container names
      - DATABASE_URL=postgresql://postgres:123@postgres:5433/talentflow_dev?schema=public
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:rabbitmq@rabbitmq:5672
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_USE_SSL=false
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=talentflow-cvs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - talentflow-network

  notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    container_name: talentflow-notification
    env_file:
      - ./notification/.env
    environment:
      - PORT=5000
      - APP_URL=http://notification:5000
      - DATABASE_URL=postgresql://postgres:123@postgres:5432/talentflow_dev?schema=public
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://rabbitmq:rabbitmq@rabbitmq:5672
    ports:
      - "${NOTIFICATION_HOST_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - talentflow-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: talentflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: talentflow_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentflow-network

  # Redis (Cache only - RabbitMQ is used for message queue)
  redis:
    image: redis:7-alpine
    container_name: talentflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentflow-network

  # RabbitMQ (Message Queue for polyglot services)
  # Management UI: http://localhost:15672 (rabbitmq/rabbitmq)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: talentflow-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - talentflow-network

  # MinIO (Local S3-compatible storage for development)
  # In production, use Cloudflare R2
  minio:
    image: minio/minio:latest
    container_name: talentflow-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - talentflow-network

  # MinIO Client (Create bucket automatically)
  minio-setup:
    image: minio/mc:latest
    container_name: talentflow-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/talentflow-cvs --ignore-existing;
      /usr/bin/mc anonymous set download myminio/talentflow-cvs;
      exit 0;
      "
    networks:
      - talentflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  talentflow-network:
    driver: bridge
