openapi: 3.0.3
info:
  title: TalentFlow AI Subscription Plans API
  version: 1.0.0
  description: >
    Completed API Gateway contract for Free, Plus, and Business subscription
    entitlements. Free is the default personal plan, Plus upgrades personal
    quota and CV fit analysis, and Business activates workspace entitlement and
    shared workspace AI quota.
servers:
  - url: /api/v1
security:
  - access-token: []
tags:
  - name: Subscriptions
    description: Personal subscription plan catalog, status, and Plus activation.
  - name: Entitlements
    description: AI action allow/deny decisions and optional quota consumption.
  - name: Workspace Subscriptions
    description: Business workspace activation and workspace subscription status.
paths:
  /subscriptions/plans:
    get:
      tags: [Subscriptions]
      summary: List active subscription plans
      description: Returns the fixed active plan catalog for Free, Plus, and Business.
      operationId: listSubscriptionPlans
      responses:
        "200":
          description: Subscription plans returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanListResponse"
              examples:
                default:
                  value:
                    data:
                      - code: FREE
                        name: Free
                        scope: PERSONAL
                        billingPeriod: NONE
                        dailyAiRequestLimit: 5
                        trialAiRequestLimit: 15
                        canScoreCv: true
                        canAnalyzeCvFit: false
                        canActivateWorkspace: false
                      - code: PLUS
                        name: Plus
                        scope: PERSONAL
                        billingPeriod: MONTHLY
                        dailyAiRequestLimit: 20
                        trialAiRequestLimit: null
                        canScoreCv: true
                        canAnalyzeCvFit: true
                        canActivateWorkspace: false
                      - code: BUSINESS
                        name: Business
                        scope: WORKSPACE
                        billingPeriod: MONTHLY
                        dailyAiRequestLimit: 500
                        trialAiRequestLimit: null
                        canScoreCv: true
                        canAnalyzeCvFit: true
                        canActivateWorkspace: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: Get current user's personal subscription status
      description: >
        Returns the caller's effective personal plan. New accounts receive Free
        by default. Plus is returned when the caller has an active Plus period.
      operationId: getMySubscription
      responses:
        "200":
          description: Personal subscription status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscriptionStatusResponse"
              examples:
                free:
                  value:
                    data:
                      effectivePlan:
                        code: FREE
                        name: Free
                        scope: PERSONAL
                        billingPeriod: NONE
                        dailyAiRequestLimit: 5
                        trialAiRequestLimit: 15
                        canScoreCv: true
                        canAnalyzeCvFit: false
                        canActivateWorkspace: false
                      status: ACTIVE
                      periodEnd: null
                      remainingDailyQuota: 5
                      remainingTrialQuota: 15
                plus:
                  value:
                    data:
                      effectivePlan:
                        code: PLUS
                        name: Plus
                        scope: PERSONAL
                        billingPeriod: MONTHLY
                        dailyAiRequestLimit: 20
                        trialAiRequestLimit: null
                        canScoreCv: true
                        canAnalyzeCvFit: true
                        canActivateWorkspace: false
                      status: ACTIVE
                      periodEnd: "2026-07-06T00:00:00.000Z"
                      remainingDailyQuota: 20
                      remainingTrialQuota: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /subscriptions/me/plus:
    post:
      tags: [Subscriptions]
      summary: Activate Plus for the current user
      description: >
        Activates a one-month Plus period for the caller. Payment provider,
        checkout, invoice, and refund flows are outside this contract.
      operationId: activatePlus
      responses:
        "201":
          description: Plus activated for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscriptionStatusResponse"
              examples:
                activated:
                  value:
                    data:
                      effectivePlan:
                        code: PLUS
                        name: Plus
                        scope: PERSONAL
                        billingPeriod: MONTHLY
                        dailyAiRequestLimit: 20
                        trialAiRequestLimit: null
                        canScoreCv: true
                        canAnalyzeCvFit: true
                        canActivateWorkspace: false
                      status: ACTIVE
                      periodEnd: "2026-07-06T00:00:00.000Z"
                      remainingDailyQuota: 20
                      remainingTrialQuota: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /subscriptions/entitlement/check:
    post:
      tags: [Entitlements]
      summary: Check and optionally consume AI entitlement
      description: >
        Resolves the caller's effective plan for a requested AI action. Personal
        context consumes personal quota. Workspace context consumes the target
        workspace's Business quota. Personal and workspace quota pools never
        overflow into each other.
      operationId: checkEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementCheckRequest"
            examples:
              personalScore:
                value:
                  contextType: personal
                  action: cv_score
                  consume: true
              workspaceAnalysis:
                value:
                  contextType: workspace
                  workspaceId: 00000000-0000-4000-8000-000000000001
                  action: cv_fit_analysis
                  consume: true
      responses:
        "200":
          description: Entitlement decision returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementDecisionResponse"
              examples:
                allowedPlus:
                  value:
                    data:
                      allowed: true
                      contextType: personal
                      resolvedPlan: Plus
                      action: cv_fit_analysis
                      remainingDailyQuota: 19
                      remainingTrialQuota: null
                      reason: null
                deniedFreeFeature:
                  value:
                    data:
                      allowed: false
                      contextType: personal
                      resolvedPlan: Free
                      action: cv_fit_analysis
                      remainingDailyQuota: 5
                      remainingTrialQuota: 15
                      reason: feature_not_allowed
                allowedWorkspace:
                  value:
                    data:
                      allowed: true
                      contextType: workspace
                      resolvedPlan: Business
                      action: cv_score
                      remainingDailyQuota: 499
                      remainingTrialQuota: null
                      reason: null
        "400":
          description: Invalid context, action, or missing workspaceId for workspace context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not allowed to use the requested workspace or feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workspaces/{workspaceId}/subscription:
    get:
      tags: [Workspace Subscriptions]
      summary: Get workspace Business subscription status
      description: Returns Business entitlement and remaining workspace AI quota for an active workspace member.
      operationId: getWorkspaceSubscription
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace subscription status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSubscriptionStatusResponse"
              examples:
                active:
                  value:
                    data:
                      workspaceId: 00000000-0000-4000-8000-000000000001
                      isBusinessActive: true
                      purchaserId: 00000000-0000-4000-8000-000000000002
                      periodEnd: "2026-07-06T00:00:00.000Z"
                      remainingDailyQuota: 500
                inactive:
                  value:
                    data:
                      workspaceId: 00000000-0000-4000-8000-000000000001
                      isBusinessActive: false
                      purchaserId: null
                      periodEnd: null
                      remainingDailyQuota: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an active workspace member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workspaces/{workspaceId}/subscription/business:
    post:
      tags: [Workspace Subscriptions]
      summary: Activate Business for a workspace
      description: >
        Activates a one-month Business period for the workspace. The caller must
        be an active workspace owner or admin. The purchaser retains owner/admin
        capability and the workspace receives a shared 500-request daily AI pool.
      operationId: activateBusiness
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "201":
          description: Business activated for the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSubscriptionStatusResponse"
              examples:
                activated:
                  value:
                    data:
                      workspaceId: 00000000-0000-4000-8000-000000000001
                      isBusinessActive: true
                      purchaserId: 00000000-0000-4000-8000-000000000002
                      periodEnd: "2026-07-06T00:00:00.000Z"
                      remainingDailyQuota: 500
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an active workspace owner/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    access-token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the API Gateway auth flow.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace identifier.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Plan:
      type: object
      required:
        - code
        - name
        - scope
        - billingPeriod
        - dailyAiRequestLimit
        - canScoreCv
        - canAnalyzeCvFit
        - canActivateWorkspace
      properties:
        code:
          type: string
          enum: [FREE, PLUS, BUSINESS]
        name:
          type: string
          enum: [Free, Plus, Business]
        scope:
          type: string
          enum: [PERSONAL, WORKSPACE]
        billingPeriod:
          type: string
          enum: [NONE, MONTHLY]
        dailyAiRequestLimit:
          type: integer
          minimum: 1
        trialAiRequestLimit:
          type: integer
          minimum: 0
          nullable: true
        canScoreCv:
          type: boolean
        canAnalyzeCvFit:
          type: boolean
        canActivateWorkspace:
          type: boolean

    PlanListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Plan"

    UserSubscriptionStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            - effectivePlan
            - status
            - remainingDailyQuota
            - remainingTrialQuota
          properties:
            effectivePlan:
              $ref: "#/components/schemas/Plan"
            status:
              type: string
              enum: [ACTIVE, CANCELLED, EXPIRED]
            periodEnd:
              type: string
              format: date-time
              nullable: true
            remainingDailyQuota:
              type: integer
              minimum: 0
            remainingTrialQuota:
              type: integer
              minimum: 0
              nullable: true

    WorkspaceSubscriptionStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            - workspaceId
            - isBusinessActive
            - purchaserId
            - periodEnd
            - remainingDailyQuota
          properties:
            workspaceId:
              type: string
              format: uuid
            isBusinessActive:
              type: boolean
            purchaserId:
              type: string
              format: uuid
              nullable: true
            periodEnd:
              type: string
              format: date-time
              nullable: true
            remainingDailyQuota:
              type: integer
              minimum: 0

    EntitlementCheckRequest:
      type: object
      required:
        - contextType
        - action
      properties:
        contextType:
          type: string
          enum: [personal, workspace]
          description: Personal context uses the caller's personal plan; workspace context uses the workspace Business plan.
        workspaceId:
          type: string
          format: uuid
          nullable: true
          description: Required when contextType is workspace.
        action:
          type: string
          enum: [cv_score, cv_fit_analysis]
        consume:
          type: boolean
          default: false
          description: When true, consume one quota unit if the action is allowed.

    EntitlementDecisionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            - allowed
            - contextType
            - resolvedPlan
            - action
            - remainingDailyQuota
            - remainingTrialQuota
          properties:
            allowed:
              type: boolean
            contextType:
              type: string
              enum: [personal, workspace]
            resolvedPlan:
              type: string
              enum: [Free, Plus, Business]
            action:
              type: string
              enum: [cv_score, cv_fit_analysis]
            remainingDailyQuota:
              type: integer
              minimum: 0
            remainingTrialQuota:
              type: integer
              minimum: 0
              nullable: true
            reason:
              type: string
              nullable: true
              enum:
                - feature_not_allowed
                - daily_quota_exhausted
                - trial_quota_exhausted
                - business_required
                - null

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
      additionalProperties: true

