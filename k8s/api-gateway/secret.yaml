apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: talentflow
  labels:
    app: api-gateway
type: Opaque
stringData:
  # JWT Secrets
  JWT_ACCESS_SECRET: "your-production-access-secret-key"
  JWT_REFRESH_SECRET: "your-production-refresh-secret-key"
  # Database
  DATABASE_URL: "postgresql://user:password@postgres-service.talentflow.svc.cluster.local:5432/talentflow_db"
  DIRECT_URL: "postgresql://user:password@postgres-service.talentflow.svc.cluster.local:5432/talentflow_db"
  # Redis
  REDIS_URL: "redis://redis-service.talentflow.svc.cluster.local:6379"
  # RabbitMQ
  RABBITMQ_URL: "amqp://user:password@rabbitmq-service.talentflow.svc.cluster.local:5672"
  # S3/MinIO/Cloudflare R2 Credentials
  R2_ACCOUNT_ID: "your-account-id"
  R2_ACCESS_KEY_ID: "your-access-key"
  R2_SECRET_ACCESS_KEY: "your-secret-key"
  # ELK
  # ELK_USERNAME: "elastic"
  # ELK_PASSWORD: "changeme"
