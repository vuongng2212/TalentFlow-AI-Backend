apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: talentflow
  labels:
    app: api-gateway
type: Opaque
stringData:
  # JWT Secrets
  JWT_ACCESS_SECRET: "your-production-access-secret-key"
  JWT_REFRESH_SECRET: "your-production-refresh-secret-key"
  # Ingestion API Key (Required, min 16 chars)
  INGESTION_API_KEY: "development-ingestion-key-123"
  # Database
  DATABASE_URL: "postgresql://postgres:your-strong-postgres-password@postgres-service.talentflow.svc.cluster.local:5432/talentflow_dev"
  DIRECT_URL: "postgresql://postgres:your-strong-postgres-password@postgres-service.talentflow.svc.cluster.local:5432/talentflow_dev"
  # Redis
  REDIS_URL: "redis://redis-service.talentflow.svc.cluster.local:6379"
  # RabbitMQ
  RABBITMQ_URL: "amqp://rabbitmq:rabbitmq@rabbitmq-service.talentflow.svc.cluster.local:5672"
  # S3/MinIO Credentials (matches k8s/middleware/minio.yaml)
  R2_ACCOUNT_ID: "talentflow"
  R2_ACCESS_KEY_ID: "minioadmin"
  R2_SECRET_ACCESS_KEY: "minioadmin"
  # MoMo merchant credentials (supply through the deployment secret manager)
  MOMO_PARTNER_CODE: "your-momo-partner-code"
  MOMO_ACCESS_KEY: "your-momo-access-key"
  MOMO_SECRET_KEY: "your-momo-secret-key"
  # ELK
  # ELK_USERNAME: "elastic"
  # ELK_PASSWORD: "changeme"
