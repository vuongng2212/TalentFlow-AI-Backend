apiVersion: v1
kind: ConfigMap
metadata:
  name: cv-parser-config
  namespace: talentflow
  labels:
    app: cv-parser
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8081"
  # RabbitMQ (service DNS from k8s/middleware/rabbitmq.yaml)
  RABBITMQ_HOST: "rabbitmq-service.talentflow.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "rabbitmq"
  # Database (service DNS from k8s/middleware/postgres.yaml)
  DATABASE_URL: "jdbc:postgresql://postgres-service.talentflow.svc.cluster.local:5432/talentflow_cv"
  DB_USER: "postgres"
  # Storage (MinIO — service DNS from k8s/middleware/minio.yaml)
  R2_ENDPOINT: "http://minio-service.talentflow.svc.cluster.local:9000"
  R2_BUCKET: "talentflow-cvs"
  R2_REGION: "us-east-1"
  # CV Parser worker tuning (decoupled from scoring client — see PR #73)
  CV_PARSER_MAX_RETRIES: "3"
  # LLM
  LLM_PROVIDER: "google"
  LLM_MODEL: "gemini-2.5-flash"
  # OCR / Tesseract
  TESSERACT_DATA_PATH: "/usr/share/tesseract-ocr/5/tessdata"
  TESSERACT_LANGUAGE: "eng+vie"
  # File validation
  FILE_MAX_SIZE_MB: "10"
  FILE_MAX_PAGES: "20"
  # Observability
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
