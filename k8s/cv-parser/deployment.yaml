apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-parser
  namespace: talentflow
  labels:
    app: cv-parser
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv-parser
  template:
    metadata:
      labels:
        app: cv-parser
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: cv-parser
          image: your-registry.com/talentflow/cv-parser:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: cv-parser-config
            - secretRef:
                name: cv-parser-secret
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
