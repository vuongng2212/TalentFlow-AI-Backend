apiVersion: v1
kind: Secret
metadata:
  name: cv-parser-secret
  namespace: talentflow
  labels:
    app: cv-parser
type: Opaque
stringData:
  # RabbitMQ password (matches k8s/middleware/rabbitmq.yaml RABBITMQ_DEFAULT_PASS)
  RABBITMQ_PASS: "rabbitmq"
  # Database
  DB_PASS: "your-production-db-password"
  # Storage credentials (MinIO / Cloudflare R2)
  R2_ACCESS_KEY_ID: "your-access-key"
  R2_SECRET_ACCESS_KEY: "your-secret-key"
  # LLM (Google Gemini)
  GEMINI_API_KEY: "your-gemini-api-key"
