apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cv-parser-monitor
  namespace: talentflow
  labels:
    release: prometheus # Matches the prometheus operator selector
spec:
  selector:
    matchLabels:
      app: cv-parser
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
