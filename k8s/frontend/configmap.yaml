apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: talentflow
  labels:
    app: frontend
data:
  NODE_ENV: "production"
  PORT: "3000"
  NEXT_PUBLIC_API_URL: "http://api-gateway-service.talentflow.svc.cluster.local:8080/api/v1"
  NEXT_PUBLIC_NOTIFICATION_WS_URL: "http://notification-service.talentflow.svc.cluster.local:5000/notifications"
