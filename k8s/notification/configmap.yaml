apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: talentflow
  labels:
    app: notification
data:
  NODE_ENV: "production"
  PORT: "5000"
  APP_NAME: "notification-service"
  APP_URL: "https://notification.talentflow.svc.cluster.local"
  CORS_ORIGIN: "https://app.talentflow.ai"
  WS_CORS_ORIGIN: "https://app.talentflow.ai"

  # RabbitMQ
  RABBITMQ_QUEUE: "notification_queue"
  RABBITMQ_EXCHANGE: "talentflow.events"
  RABBITMQ_PREFETCH_COUNT: "10"

  # SMTP
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_FROM: "TalentFlow <noreply@talentflow.ai>"

  # Logging & Observability
  ELK_HOST: "http://elasticsearch.logging.svc.cluster.local:9200"
  ELK_LOG_LEVEL: "info"
  ELK_INDEX_PREFIX: "talentflow-notification"

  # Distributed Tracing
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "notification-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring.svc.cluster.local:4318"
