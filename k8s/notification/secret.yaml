apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
  namespace: talentflow
  labels:
    app: notification
  annotations:
    # Reminder: In production use Sealed Secrets, Vault, or External Secrets Operator
    # DO NOT commit real values to Git. Fill in values with:
    #   kubectl create secret generic notification-secret \
    #     --from-env-file=./notification/.env \
    #     -n talentflow --dry-run=client -o yaml | kubectl apply -f -
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres-service.talentflow.svc.cluster.local:5432/talentflow_dev"

  # Redis
  REDIS_HOST: "redis-service.talentflow.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

  # RabbitMQ
  RABBITMQ_URL: "amqp://rabbitmq:CHANGE_ME@rabbitmq-service.talentflow.svc.cluster.local:5672"

  # JWT
  JWT_ACCESS_SECRET: "CHANGE_ME_min_32_chars"
  JWT_EXPIRES_IN: "1d"

  # SMTP
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASS: "CHANGE_ME"
