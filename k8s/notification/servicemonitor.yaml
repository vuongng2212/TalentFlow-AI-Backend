apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notification-monitor
  namespace: talentflow
  labels:
    release: prometheus # Matches the Prometheus Operator selector
spec:
  selector:
    matchLabels:
      app: notification
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
