apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'
      queryTimeout: '60s'
      httpMethod: POST

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    editable: false
    jsonData:
      index: 'talentflow-*'
      timeField: '@timestamp'
      esVersion: '8.0.0'
      maxConcurrentShardRequests: 5
      logMessageField: message
      logLevelField: 'log.level'

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: Elasticsearch
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true

