input {
  # ─── Direct log input via TCP (JSON format) ───────────────────────
  # API Gateway and Notification services send structured JSON logs here
  # when LOGSTASH_HOST is set (alternative to direct Elasticsearch transport).
  tcp {
    port => 5044
    codec => json_lines {
      charset => "UTF-8"
    }
    tags => ["tcp-input"]
  }

  # ─── Beats input (Filebeat / Metricbeat) ──────────────────────────
  beats {
    port => 5045
    tags => ["beats-input"]
  }
}

filter {
  # ─── Parse @timestamp from the log payload if present ─────────────
  if [fields][timestamp] {
    date {
      match => ["[fields][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # ─── Normalize service name label ─────────────────────────────────
  if ![service] and [fields][service] {
    mutate {
      add_field => { "service" => "%{[fields][service]}" }
    }
  }

  # ─── Promote severity → log.level (ECS-compatible) ────────────────
  if [severity] {
    mutate {
      rename => { "severity" => "[log][level]" }
    }
  }

  # ─── Strip internal Logstash fields ───────────────────────────────
  mutate {
    remove_field => ["event", "host", "agent", "ecs"]
  }
}

output {
  # ─── Forward everything to Elasticsearch ──────────────────────────
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Dynamic index per service: talentflow-api-gateway-2025.01.15
    # Falls back to talentflow-unknown-YYYY.MM.dd
    index => "talentflow-%{[service]:-unknown}-%{+YYYY.MM.dd}"

    # ILM disabled for simplicity in dev — use Curator in production
    ilm_enabled => false
  }

  # ─── Debug: echo all processed events to Logstash stdout ──────────
  # Disable in production for performance
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
